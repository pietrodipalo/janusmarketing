<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Istituto Janus — Dashboard Marketing</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F1F5F9; --s1:#FFFFFF; --s2:#E2E8F0; --bd:#CBD5E1;
  --tx:#1E293B; --mu:#64748B; --acc:#6366F1;
  --G:#DC2626; --M:#2563EB; --CD:#D97706; --SW:#7C3AED; --PP:#16A34A;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);
  font-family:'Segoe UI',Arial,sans-serif;display:flex;flex-direction:column;}

/* HEADER */
.hdr{display:flex;align-items:center;justify-content:space-between;
     padding:0 20px;height:46px;background:#fff;border-bottom:2px solid var(--bd);
     flex-shrink:0;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.hdr h1{font-size:14px;font-weight:700;color:var(--tx);letter-spacing:.02em;}
.hdr .upd{font-size:10px;color:var(--mu);}

/* CONTROLS */
.ctrl{display:flex;align-items:center;gap:10px;padding:0 16px;height:40px;
      background:#fff;border-bottom:1px solid var(--bd);flex-shrink:0;}
.btn-grp{display:flex;gap:2px;}
.vbtn{padding:4px 12px;border:1px solid var(--bd);background:var(--s2);color:var(--mu);
      border-radius:6px;cursor:pointer;font-size:11px;font-weight:600;transition:.15s;}
.vbtn.active{background:var(--acc);color:#fff;border-color:var(--acc);}
label{font-size:11px;color:var(--mu);font-weight:600;}
.sel{background:#fff;color:var(--tx);border:1px solid var(--bd);border-radius:6px;
     padding:3px 8px;font-size:11px;cursor:pointer;}
.sp{flex:1;}
.pill{background:var(--acc);color:#fff;font-size:10px;font-weight:700;
      padding:3px 12px;border-radius:12px;letter-spacing:.05em;}
.ws{display:flex;align-items:center;gap:6px;}
.hidden{display:none!important;}

/* KPI BAND */
.kpi-band{flex-shrink:0;background:var(--bg);}
.kpi-row{display:grid;gap:8px;padding:8px 16px 0;}
.kpi-r1{grid-template-columns:repeat(7,1fr);}
.kpi-r2{grid-template-columns:repeat(3,1fr) repeat(3,1fr) repeat(3,1fr);padding-bottom:8px;}
.kpi{background:#fff;border-radius:9px;padding:8px 12px;border-left:4px solid;
     box-shadow:0 1px 3px rgba(0,0,0,.07);}
.kpi .lbl{font-size:8px;text-transform:uppercase;letter-spacing:.08em;color:var(--mu);font-weight:700;}
.kpi .val{font-size:17px;font-weight:800;line-height:1.3;margin:2px 0;}
.kpi .sub{font-size:8px;color:var(--mu);}
/* canale card colors */
.kg{border-left-color:var(--G);}  .kg .val{color:var(--G);}
.km{border-left-color:var(--M);}  .km .val{color:var(--M);}
.kcd{border-left-color:var(--CD);}.kcd .val{color:var(--CD);}
.ksw{border-left-color:var(--SW);}.ksw .val{color:var(--SW);}
.kpp{border-left-color:var(--PP);}.kpp .val{color:var(--PP);}
.kt{border-left-color:var(--acc);}.kt .val{color:var(--acc);}

/* separator between channel groups */
.sep{border-top:2px solid var(--bd);margin-top:0;}
.grp-g{background:#FEF2F2;}
.grp-m{background:#EFF6FF;}
.grp-o{background:#FFFBEB;}

/* MAIN 2×2 */
.main{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:8px;
      padding:8px 16px;flex:1;min-height:0;}
.card{background:#fff;border:1px solid var(--bd);border-radius:10px;
      display:flex;flex-direction:column;min-height:0;overflow:hidden;
      box-shadow:0 1px 4px rgba(0,0,0,.05);}
.ctitle{font-size:10px;font-weight:700;color:var(--mu);text-transform:uppercase;
        letter-spacing:.07em;padding:10px 14px 0;flex-shrink:0;}
.cw{flex:1;min-height:0;padding:6px 12px 10px;position:relative;}
.pie-inner{display:flex;flex:1;min-height:0;gap:8px;padding:6px 12px 10px;}
.pie-cw{flex:0 0 42%;position:relative;}
.leg{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:5px;justify-content:center;}
.leg-item{display:flex;align-items:center;gap:8px;font-size:9px;}
.leg-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;}
.chips{display:flex;gap:8px;padding:2px 14px 4px;flex-shrink:0;}
.chip{font-size:8px;font-weight:700;padding:2px 8px;border-radius:10px;}

/* TABLE */
.tbl-wrap{flex:1;overflow-y:auto;min-height:0;}
table{width:100%;border-collapse:collapse;font-size:9px;}
th{position:sticky;top:0;background:#F8FAFC;padding:5px 6px;text-align:right;
   font-weight:700;font-size:8px;letter-spacing:.04em;color:var(--mu);
   border-bottom:2px solid var(--bd);white-space:nowrap;}
th:first-child{text-align:left;}
td{padding:4px 6px;text-align:right;border-bottom:1px solid #F1F5F9;white-space:nowrap;}
td:first-child{text-align:left;color:var(--mu);font-weight:600;}
tr:hover td{background:#F8FAFC;}
.cG{color:var(--G);font-weight:600;}
.cM{color:var(--M);font-weight:600;}
.cCD{color:var(--CD);font-weight:600;}
.cSW{color:var(--SW);font-weight:600;}
.cPP{color:var(--PP);font-weight:600;}
.cT{color:var(--acc);font-weight:700;}
</style>
</head>

<div class="hdr">
  <h1>📊 Istituto Janus — Dashboard Marketing per Canale</h1>
  <div class="upd">Aggiornato: 24/08/2026</div>
</div>

<div class="ctrl">
  <div class="btn-grp">
    <button class="vbtn active" onclick="setView('monthly')">Mensile</button>
    <button class="vbtn"        onclick="setView('quarterly')">Trimestrale</button>
    <button class="vbtn"        onclick="setView('annual')">Annuale</button>

  <div class="ws"><label>Anno:</label>
    <select class="sel" id="yf" onchange="updateSelectors();render()"></select></div>
  <div class="ws hidden" id="wrap-month"><label>Mese:</label>
    <select class="sel" id="mf" onchange="render()"></select></div>
  <div class="ws hidden" id="wrap-qtr"><label>Trimestre:</label>
    <select class="sel" id="qf" onchange="render()"></select></div>
  <div class="sp"></div>
  <span class="pill" id="period-pill"></span>
</div>

<div class="kpi-band">
  <div class="kpi-row kpi-r1" id="kpi-r1"></div>
  <div class="kpi-row kpi-r2" id="kpi-r2"></div>
</div>

<div class="main">
  <!-- Spesa -->
  <div class="card">
    <div class="ctitle">Spesa per canale</div>
    <div class="chips">
      <span class="chip" style="background:#FEE2E2;color:#DC2626">● Google</span>
      <span class="chip" style="background:#DBEAFE;color:#2563EB">● Meta</span>
    </div>
    <div class="cw"><canvas id="barSpend"></canvas></div>
  </div>
  <!-- Donut -->
  <div class="card">
    <div class="ctitle">Lead Utili per canale</div>
    <div class="pie-inner">
      <div class="pie-cw"><canvas id="pieC"></canvas></div>
      <div class="leg" id="leg"></div>
    </div>
  </div>
  <!-- CPL trend -->
  <div class="card">
    <div class="ctitle">CPL per canale — trend storico</div>
    <div class="chips">
      <span class="chip" style="background:#FEE2E2;color:#DC2626">● Google</span>
      <span class="chip" style="background:#DBEAFE;color:#2563EB">● Meta</span>
    </div>
    <div class="cw"><canvas id="lineChart"></canvas></div>
  </div>
  <!-- Tabella -->
  <div class="card">
    <div class="ctitle">Riepilogo per periodo</div>
    <div class="tbl-wrap">
      <table>
        <thead><tr>
          <th style="text-align:left">Periodo</th>
          <th class="cG">Sp.G</th><th class="cG">LU</th><th class="cG">Isc</th>
          <th class="cM">Sp.M</th><th class="cM">LU</th><th class="cM">Isc</th>
          <th class="cCD">CD·LU</th><th class="cCD">Isc</th>
          <th class="cSW">SW·LU</th><th class="cSW">Isc</th>
          <th class="cPP">PP</th>
          <th class="cT">Isc.Mktg</th><th class="cT">CAC</th><th>Conv%</th>
        </tr></thead>
        <tbody id="tbl-body"></tbody>
      </table>
    </div>
  </div>
</div>

const MN=['Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott','Nov','Dic'];
let view='monthly',bSpend=null,bLine=null,pC=null;

const fe=n=>n>0?'€'+Math.round(n).toLocaleString('it-IT'):'—';
const fn=n=>n>0?n.toLocaleString('it-IT'):(n===0?'0':'—');
const fp=n=>(isFinite(n)&&n>0)?(n*100).toFixed(1)+'%':'—';

const yf=document.getElementById('yf');
const years=[...new Set(DATA.map(d=>d.year))].sort();
yf.innerHTML='<option value="all">Tutti gli anni</option>'+years.map(y=>`<option value="${y}">${y}</option>`).join('');
yf.value='2026';

function updateSelectors(){
  const sy=yf.value,wm=document.getElementById('wrap-month'),wq=document.getElementById('wrap-qtr');
  wm.classList.add('hidden'); wq.classList.add('hidden');
  if(view==='monthly'&&sy!=='all'){
    const av=[...new Set(DATA.filter(d=>String(d.year)===sy).map(d=>d.month))].sort((a,b)=>a-b);
    document.getElementById('mf').innerHTML='<option value="all">Tutti i mesi</option>'+
      av.map(m=>`<option value="${m}">${MN[m-1]}</option>`).join('');
    wm.classList.remove('hidden');
  }
  if(view==='quarterly'&&sy!=='all'){
    const av=[...new Set(DATA.filter(d=>String(d.year)===sy).map(d=>Math.ceil(d.month/3)))].sort();
    document.getElementById('qf').innerHTML='<option value="all">Tutti i trimestri</option>'+
      av.map(q=>`<option value="${q}">Q${q}</option>`).join('');
    wq.classList.remove('hidden');
  }
}

function setView(v){
  view=v;
  document.querySelectorAll('.vbtn').forEach(b=>b.classList.toggle('active',
    (v==='monthly'&&b.textContent.includes('Mens'))||
    (v==='quarterly'&&b.textContent.includes('Trim'))||
    (v==='annual'&&b.textContent.includes('Ann'))));
  updateSelectors(); render();
}

function getPeriodLabel(){
  const sy=yf.value,sm=document.getElementById('mf').value,sq=document.getElementById('qf').value;
  if(sy==='all') return 'Tutti gli anni';
  if(view==='monthly') return sm==='all'?sy:MN[+sm-1]+' '+sy;
  if(view==='quarterly') return sq==='all'?sy:'Q'+sq+' '+sy;
  return sy;
}

function filt(){
  const sy=yf.value,sm=document.getElementById('mf').value,sq=document.getElementById('qf').value;
  let d=DATA;
  if(sy!=='all') d=d.filter(r=>String(r.year)===sy);
  if(view==='monthly'&&sm!=='all') d=d.filter(r=>r.month===+sm);
  if(view==='quarterly'&&sq!=='all') d=d.filter(r=>Math.ceil(r.month/3)===+sq);
  return d;
}

function groupKey(d){
  const sq=document.getElementById('qf').value;
  if(view==='annual'||yf.value==='all') return String(d.year);
  if(view==='quarterly'&&sq==='all') return 'Q'+Math.ceil(d.month/3);
  return MN[d.month-1];
}

function agg(rows){
  const t={gSp:0,mSp:0,gL:0,gN:0,gI:0,mL:0,mN:0,mI:0,
           ppL:0,ppN:0,ppI:0,cdL:0,cdN:0,cdI:0,swL:0,swN:0,swI:0};
  rows.forEach(d=>{
    t.gSp+=d.google.spend; t.gL+=d.google.leads; t.gN+=d.google.ng; t.gI+=d.google.iscritti;
    t.mSp+=d.meta.spend;   t.mL+=d.meta.leads;   t.mN+=d.meta.ng;   t.mI+=d.meta.iscritti;
    t.ppL+=d.org.pp.leads; t.ppN+=d.org.pp.ng;   t.ppI+=d.org.pp.iscritti;
    t.cdL+=d.org.cd.leads; t.cdN+=d.org.cd.ng;   t.cdI+=d.org.cd.iscritti;
    t.swL+=d.org.sw.leads; t.swN+=d.org.sw.ng;   t.swI+=d.org.sw.iscritti;
  });
  t.gLu=Math.max(0,t.gL-t.gN); t.mLu=Math.max(0,t.mL-t.mN);
  t.ppLu=Math.max(0,t.ppL-t.ppN); t.cdLu=Math.max(0,t.cdL-t.cdN); t.swLu=Math.max(0,t.swL-t.swN);
  t.totLu=t.gLu+t.mLu+t.ppLu+t.cdLu+t.swLu;
  t.totSp=t.gSp+t.mSp;
  t.iscMktg=t.gI+t.mI+t.cdI+t.swI;
  t.totI=t.gI+t.mI+t.ppI+t.cdI+t.swI;
  t.gCpl=t.gLu>0?t.gSp/t.gLu:0; t.mCpl=t.mLu>0?t.mSp/t.mLu:0;
  t.gCac=t.gI>0?t.gSp/t.gI:0;   t.mCac=t.mI>0?t.mSp/t.mI:0;
  t.cacMktg=t.iscMktg>0?t.totSp/t.iscMktg:0;
  t.totConv=t.totLu>0?t.totI/t.totLu:0;
  t.cdConv=t.cdLu>0?t.cdI/t.cdLu:0; t.swConv=t.swLu>0?t.swI/t.swLu:0;
  t.pctInut=(t.gL+t.mL+t.ppL+t.cdL+t.swL)>0
    ?(t.gN+t.mN+t.ppN+t.cdN+t.swN)/(t.gL+t.mL+t.ppL+t.cdL+t.swL):0;
  return t;
}

function kpiCard(lbl,val,sub,cls){
  return `<div class="kpi ${cls}"><div class="lbl">${lbl}</div><div class="val">${val}</div><div class="sub">${sub}</div></div>`;
}

function render(){
  document.getElementById('period-pill').textContent=getPeriodLabel();
  const rows=filt(); if(!rows.length) return;
  const keyMap={};
  rows.forEach(d=>{const k=groupKey(d);if(!keyMap[k])keyMap[k]=[];keyMap[k].push(d);});
  const grouped=Object.keys(keyMap).map(k=>({key:k,...agg(keyMap[k])}));
  const tot=agg(rows);

  // KPI ROW 1
  document.getElementById('kpi-r1').innerHTML=
    kpiCard('Spesa Adv',fe(tot.totSp),'Google + Meta','kt')+
    kpiCard('Lead Utili Totali',fn(tot.totLu),`su ${fn(tot.gL+tot.mL+tot.ppL+tot.cdL+tot.swL)} totali`,'kt')+
    kpiCard('% Lead Inutili',fp(tot.pctInut),'tutti i canali','kt')+
    kpiCard('Passa Parola',fn(tot.ppI),'iscritti word of mouth','kpp')+
    kpiCard('Isc. Marketing',fn(tot.iscMktg),'G+M+CD+SW (excl. PP)','kt')+
    kpiCard('Iscritti Totali',fn(tot.totI),'Marketing + Passa Parola','kt')+
    kpiCard('CAC Marketing',fe(tot.cacMktg),'Spesa ÷ Isc. Marketing','kt');

  // KPI ROW 2
  document.getElementById('kpi-r2').innerHTML=
    kpiCard('Spesa Google',fe(tot.gSp),fn(tot.gLu)+' lead utili','kg')+
    kpiCard('CPL Google',fe(tot.gCpl),'costo per lead utile','kg')+
    kpiCard('Iscritti Google',fn(tot.gI),'CAC '+fe(tot.gCac),'kg')+
    kpiCard('Spesa Meta',fe(tot.mSp),fn(tot.mLu)+' lead utili','km')+
    kpiCard('CPL Meta',fe(tot.mCpl),'costo per lead utile','km')+
    kpiCard('Iscritti Meta',fn(tot.mI),'CAC '+fe(tot.mCac),'km')+
    kpiCard('Contatto Diretto',fn(tot.cdLu)+' Lead Utili',fn(tot.cdI)+' isc · conv '+fp(tot.cdConv),'kcd')+
    kpiCard('Sito Web',fn(tot.swLu)+' Lead Utili',fn(tot.swI)+' isc · conv '+fp(tot.swConv),'ksw')+
    kpiCard('Passa Parola',fn(tot.ppLu)+' Lead Utili',fn(tot.ppI)+' isc (word of mouth)','kpp');

  // Chart options (light theme)
  const gridColor='rgba(0,0,0,.06)';
  const tickColor='#64748B';
  const base={responsive:true,maintainAspectRatio:false,animation:{duration:150},
    plugins:{legend:{display:false}},
    scales:{x:{grid:{color:gridColor},ticks:{color:tickColor,font:{size:9},maxRotation:40}},
            y:{grid:{color:gridColor},ticks:{color:tickColor,font:{size:9},callback:v=>fe(v)}}}};

  if(bSpend) bSpend.destroy();
  bSpend=new Chart(document.getElementById('barSpend'),{type:'bar',
    data:{labels:grouped.map(g=>g.key),datasets:[
      {label:'Google',data:grouped.map(g=>Math.round(g.gSp)),backgroundColor:'#FCA5A5',borderColor:'#DC2626',borderWidth:1.5,borderRadius:4},
      {label:'Meta',  data:grouped.map(g=>Math.round(g.mSp)),backgroundColor:'#BFDBFE',borderColor:'#2563EB',borderWidth:1.5,borderRadius:4},
    ]},
    options:{...base,plugins:{legend:{display:false},
      tooltip:{callbacks:{label:ctx=>` ${ctx.dataset.label}: ${fe(ctx.raw)}`}}},
      scales:{x:{...base.scales.x,stacked:true},y:{...base.scales.y,stacked:true}}}
  });

  if(pC) pC.destroy();
  const pd=[tot.gLu,tot.mLu,tot.cdLu,tot.swLu,tot.ppLu];
  const pl=['Google','Meta','Contatto Diretto','Sito Web','Passa Parola'];
  const pc=['#DC2626','#2563EB','#D97706','#7C3AED','#16A34A'];
  const pSum=pd.reduce((a,b)=>a+b,0);
  pC=new Chart(document.getElementById('pieC'),{type:'doughnut',
    data:{labels:pl,datasets:[{data:pd,
      backgroundColor:['#FEE2E2','#DBEAFE','#FEF3C7','#EDE9FE','#DCFCE7'],
      borderColor:pc,borderWidth:2.5,hoverOffset:6}]},
    options:{responsive:true,maintainAspectRatio:false,animation:{duration:150},
      plugins:{legend:{display:false},
        tooltip:{callbacks:{label:ctx=>` ${ctx.label}: ${fn(ctx.raw)} (${pSum>0?((ctx.raw/pSum)*100).toFixed(1):0}%)`}}}}
  });
  document.getElementById('leg').innerHTML=pl.map((l,i)=>`
    <div class="leg-item">
      <div class="leg-dot" style="background:${pc[i]}"></div>
      <div>
        <div style="font-weight:700;color:${pc[i]}">${l}</div>
        <div style="color:#64748B">${fn(pd[i])} lead utili (${pSum>0?((pd[i]/pSum)*100).toFixed(1):0}%)</div>
      </div>
    </div>`).join('');

  if(bLine) bLine.destroy();
  bLine=new Chart(document.getElementById('lineChart'),{type:'line',
    data:{labels:grouped.map(g=>g.key),datasets:[
      {label:'CPL Google',data:grouped.map(g=>g.gCpl>0?+g.gCpl.toFixed(2):null),
       borderColor:'#DC2626',backgroundColor:'#FEE2E280',tension:.3,pointRadius:3,fill:true},
      {label:'CPL Meta',  data:grouped.map(g=>g.mCpl>0?+g.mCpl.toFixed(2):null),
       borderColor:'#2563EB',backgroundColor:'#DBEAFE80',tension:.3,pointRadius:3,fill:true},
    ]},
    options:{...base,plugins:{legend:{display:false},
      tooltip:{callbacks:{label:ctx=>` ${ctx.dataset.label}: ${fe(ctx.raw)}`}}}}
  });

  document.getElementById('tbl-body').innerHTML=grouped.map(g=>`<tr>
    <td>${g.key}</td>
    <td class="cG">${fe(g.gSp)}</td><td class="cG">${fn(g.gLu)}</td><td class="cG">${fn(g.gI)}</td>
    <td class="cM">${fe(g.mSp)}</td><td class="cM">${fn(g.mLu)}</td><td class="cM">${fn(g.mI)}</td>
    <td class="cCD">${fn(g.cdLu)}</td><td class="cCD">${fn(g.cdI)}</td>
    <td class="cSW">${fn(g.swLu)}</td><td class="cSW">${fn(g.swI)}</td>
    <td class="cPP">${fn(g.ppI)}</td>
    <td class="cT">${fn(g.iscMktg)}</td><td class="cT">${fe(g.cacMktg)}</td><td>${fp(g.totConv)}</td>
  </tr>`).join('');
}

updateSelectors(); render();
</script>
</body>
</html>
