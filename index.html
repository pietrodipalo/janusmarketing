<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spese Janus</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#0f1117;--s1:#1a1d27;--s2:#222636;--bd:#2e3248;
  --tx:#e2e8f0;--mu:#8892a4;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:13px;display:flex;flex-direction:column;}

.hdr{background:var(--s1);border-bottom:1px solid var(--bd);padding:0 20px;height:46px;display:flex;align-items:center;gap:10px;flex-shrink:0;}
.hdr h1{font-size:15px;font-weight:700;}
.hdr .sub{color:var(--mu);font-size:12px;}
.badge{background:#6366f1;color:#fff;padding:1px 8px;border-radius:99px;font-size:10px;font-weight:700;}
.hdr .right{margin-left:auto;display:flex;gap:10px;align-items:center;color:var(--mu);font-size:11px;}

/* CONTROLS */
.ctrl{background:var(--s1);border-bottom:1px solid var(--bd);padding:0 20px;height:42px;display:flex;align-items:center;gap:8px;flex-shrink:0;}
.ctrl label{color:var(--mu);font-size:11px;white-space:nowrap;}
.bgrp{display:flex;background:var(--bg);border:1px solid var(--bd);border-radius:6px;overflow:hidden;}
.bgrp button{background:none;border:none;border-right:1px solid var(--bd);color:var(--mu);padding:5px 14px;cursor:pointer;font-size:12px;font-weight:500;transition:all .12s;white-space:nowrap;}
.bgrp button:last-child{border-right:none;}
.bgrp button:hover{background:var(--s2);color:var(--tx);}
.bgrp button.on{background:#6366f1;color:#fff;}
select.sel{background:var(--bg);border:1px solid var(--bd);color:var(--tx);padding:5px 10px;border-radius:6px;font-size:12px;cursor:pointer;}
.sel-wrap{display:flex;align-items:center;gap:6px;transition:opacity .15s;}
.sel-wrap.hidden{opacity:0;pointer-events:none;width:0;overflow:hidden;}
.divider{width:1px;height:22px;background:var(--bd);margin:0 4px;}
.sp{flex:1;}
/* period label pill */
.period-pill{background:rgba(99,102,241,.15);border:1px solid rgba(99,102,241,.35);color:#a5b4fc;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:600;white-space:nowrap;}

/* KPI */
.kpi-row{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding:8px 20px;flex-shrink:0;}
.kpi{background:var(--s1);border:1px solid var(--bd);border-top:2px solid;border-radius:8px;padding:8px 14px;}
.kpi .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);}
.kpi .val{font-size:20px;font-weight:700;line-height:1.2;margin:2px 0;}
.kpi .sub{font-size:10px;color:var(--mu);}

/* MAIN */
.main{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:8px;padding:0 20px 8px;min-height:0;}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:8px;padding:10px 14px;display:flex;flex-direction:column;min-height:0;}
.ctitle{font-size:10px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px;flex-shrink:0;}
.cw{flex:1;position:relative;min-height:0;}
.cw canvas{position:absolute;top:0;left:0;width:100%!important;height:100%!important;}

/* PIE */
.pie-inner{display:flex;gap:10px;flex:1;min-height:0;}
.pie-cw{flex:0 0 160px;position:relative;}
.pie-cw canvas{position:absolute;top:0;left:0;width:100%!important;height:100%!important;}
.leg{display:flex;flex-direction:column;gap:4px;justify-content:center;overflow-y:auto;flex:1;}
.leg-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--mu);}
.leg-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.leg-item strong{color:var(--tx);}

/* TABLE */
.tbl-card{background:var(--s1);border:1px solid var(--bd);border-radius:8px;display:flex;flex-direction:column;min-height:0;overflow:hidden;}
.tbl-hdr{padding:8px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--bd);flex-shrink:0;}
.tbl-hdr .t{font-size:10px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.07em;}
.tbl-hdr .filters{margin-left:auto;display:flex;gap:6px;}
.srch{background:var(--s2);border:1px solid var(--bd);color:var(--tx);padding:4px 10px;border-radius:5px;font-size:12px;width:150px;}
select.cf{background:var(--s2);border:1px solid var(--bd);color:var(--tx);padding:4px 8px;border-radius:5px;font-size:11px;}
.tbl-body{overflow-y:auto;flex:1;}
table{width:100%;border-collapse:collapse;}
th{background:var(--s2);padding:6px 12px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);position:sticky;top:0;z-index:1;}
td{padding:5px 12px;border-bottom:1px solid rgba(46,50,72,.5);font-size:12px;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(255,255,255,.02);}
.pill{display:inline-block;padding:1px 7px;border-radius:99px;font-size:10px;font-weight:600;}
.amt{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;}
.sx{color:#f59e0b;font-size:10px;font-weight:700;}
.si{color:#10b981;font-size:10px;font-weight:700;}
</style>
</head>
<body>

<div class="hdr">
  <h1>📊 Spese Istituto Janus</h1>
  <span class="sub" id="dr"></span>
  <span class="badge">6 categorie</span>
  <div class="right">
    <span id="txcount"></span>
    <span>Agg. <span id="lu"></span></span>
  </div>
</div>

<div class="ctrl">
  <label>Visualizza:</label>
  <div class="bgrp">
    <button class="on" onclick="sv('monthly')">Mensile</button>
    <button onclick="sv('quarterly')">Trimestrale</button>
    <button onclick="sv('yearly')">Annuale</button>
  </div>

  <div class="divider"></div>

  <!-- Anno sempre visibile -->
  <div class="sel-wrap" id="wrap-year">
    <label>Anno:</label>
    <select class="sel" id="yf" onchange="onYearChange()"></select>
  </div>

  <!-- Mese: appare solo in vista Mensile con anno specifico -->
  <div class="sel-wrap hidden" id="wrap-month">
    <label>Mese:</label>
    <select class="sel" id="mf" onchange="render()"></select>
  </div>

  <!-- Trimestre: appare solo in vista Trimestrale con anno specifico -->
  <div class="sel-wrap hidden" id="wrap-qtr">
    <label>Trimestre:</label>
    <select class="sel" id="qf" onchange="render()"></select>
  </div>

  <div class="sp"></div>
  <span class="period-pill" id="period-pill"></span>
</div>

<div class="kpi-row" id="kpi"></div>
<div class="kpi-row" id="kpi-funnel" style="grid-template-columns:repeat(5,1fr);padding-top:0;display:none;border-top:1px solid rgba(255,255,255,.06);"></div>

<div class="main">
  <div class="card">
    <div class="ctitle" id="bt">Spese mensili per categoria</div>
    <div class="cw"><canvas id="barC"></canvas></div>
  </div>
  <div class="card">
    <div class="ctitle">Distribuzione periodo</div>
    <div class="pie-inner">
      <div class="pie-cw"><canvas id="pieC"></canvas></div>
      <div class="leg" id="leg"></div>
    </div>
  </div>
  <div class="card">
    <div class="ctitle">Trend Google Ads vs Meta — storico mensile</div>
    <div class="cw"><canvas id="lineC"></canvas></div>
  </div>
  <div class="tbl-card">
    <div class="tbl-hdr">
      <span class="t">Movimenti</span>
      <div class="filters">
        <select class="cf" id="cf" onchange="rt()">
          <option value="all">Tutte le categorie</option>
          <option value="Google Ads">Google Ads</option>
          <option value="Meta Ads">Meta Ads</option>
          <option value="Gestione">Gestione</option>
          <option value="Acquisti Materiali">Acquisti Materiali</option>
          <option value="Travel">Travel</option>
          <option value="Varie">Varie</option>
        </select>
        <input class="srch" id="srch" type="text" placeholder="🔍 Cerca..." oninput="rt()">
      </div>
    </div>
    <div class="tbl-body">
      <table>
        <thead><tr>
          <th>Data</th><th>Descrizione</th><th>Cat.</th><th>Carta</th><th class="amt">€</th>
        </tr></thead>
        <tbody id="tb"></tbody>
      </table>
    </div>
  </div>
</div>

  document.querySelectorAll('.bgrp button').forEach((b,i)=>b.classList.toggle('on',['monthly','quarterly','yearly'][i]===v));
  updateSelectors();
  render();
}

// --- YEAR CHANGE ---
function onYearChange(){
  updateSelectors();
  render();
}

// --- UPDATE SELECTORS (show/hide month & quarter pickers) ---
function updateSelectors(){
  const sy=yf.value;
  const wm=document.getElementById('wrap-month');
  const wq=document.getElementById('wrap-qtr');
  const mf=document.getElementById('mf');
  const qf=document.getElementById('qf');

  // Reset hidden
  wm.classList.add('hidden'); wq.classList.add('hidden');

  if(view==='monthly' && sy!=='all'){
    // Build month options from available data for this year
    const availMonths=[...new Set(RAW.filter(t=>String(t.year)===sy).map(t=>t.month))].sort((a,b)=>a-b);
    mf.innerHTML='<option value="all">Tutti i mesi</option>'+availMonths.map(m=>`<option value="${m}">${MNL[m-1]}</option>`).join('');
    wm.classList.remove('hidden');
  } else {
    mf.value='all';
  }

  if(view==='quarterly' && sy!=='all'){
    const availQtrs=[...new Set(RAW.filter(t=>String(t.year)===sy).map(t=>Math.ceil(t.month/3)))].sort();
    qf.innerHTML='<option value="all">Tutti i trimestri</option>'+availQtrs.map(q=>`<option value="${q}">Q${q}</option>`).join('');
    wq.classList.remove('hidden');
  } else {
    qf.value='all';
  }
}

// --- FILTER DATA based on current selections ---
function filt(){
  const sy=yf.value;
  const sm=document.getElementById('mf').value;
  const sq=document.getElementById('qf').value;
  let d=RAW;
  if(sy!=='all') d=d.filter(t=>String(t.year)===sy);
  if(view==='monthly' && sm!=='all') d=d.filter(t=>t.month===+sm);
  if(view==='quarterly' && sq!=='all') d=d.filter(t=>Math.ceil(t.month/3)===+sq);
  return d;
}

// --- PERIOD LABEL ---
function getPeriodLabel(){
  const sy=yf.value;
  const sm=document.getElementById('mf').value;
  const sq=document.getElementById('qf').value;
  if(sy==='all') return 'Tutti gli anni';
  if(view==='monthly'){
    if(sm==='all') return sy;
    return MNL[+sm-1]+' '+sy;
  }
  if(view==='quarterly'){
    if(sq==='all') return sy;
    return 'Q'+sq+' '+sy;
  }
  return sy;
}

// --- GROUP KEY for bar chart ---
function gk(t){
  const sm=document.getElementById('mf').value;
  const sq=document.getElementById('qf').value;
  // Single month selected → group by category (show as category breakdown)
  if(view==='monthly' && sm!=='all') return t.category;
  // Single quarter → group by month
  if(view==='quarterly' && sq!=='all') return t.year+'-'+String(t.month).padStart(2,'0');
  // Default
  if(view==='monthly') return t.year+'-'+String(t.month).padStart(2,'0');
  if(view==='quarterly') return t.year+'-Q'+Math.ceil(t.month/3);
  return String(t.year);
}
function kl(k){
  if(k.includes('-Q')) return k;
  if(/^\d{4}-\d{2}$/.test(k)){const[y,m]=k.split('-');return MN[+m-1]+' '+y;}
  // Category key (single month view)
  return k;
}

// --- RENDER ---
function render(){
  const data=filt();
  document.getElementById('period-pill').textContent=getPeriodLabel();

  const keys=[],map={};
  const sm=document.getElementById('mf').value;
  const sq=document.getElementById('qf').value;
  const isCatMode=view==='monthly'&&sm!=='all'; // single month: bars = categories

  data.forEach(t=>{
    const k=gk(t);
    if(!map[k]){map[k]={};CATS.forEach(c=>map[k][c]=0);keys.push(k);}
    map[k][t.category]=(map[k][t.category]||0)+t.amount;
  });
  if(isCatMode){
    // Sort by category order
    keys.sort((a,b)=>CATS.indexOf(a)-CATS.indexOf(b));
  } else {
    keys.sort();
  }

  const tot={};CATS.forEach(c=>{tot[c]=data.filter(t=>t.category===c).reduce((s,t)=>s+t.amount,0);});
  const totA=Object.values(tot).reduce((a,b)=>a+b,0);
  const tadv=tot['Google Ads']+tot['Meta Ads'];
  const nk=Math.max(keys.length,1);

  // KPI
  document.getElementById('kpi').innerHTML=[
    {l:'Totale',v:fe(totA),s:data.length+' tx',c:'#6366f1'},
    {l:'Google Ads',v:fe(tot['Google Ads']),s:'media '+fe(Math.round(tot['Google Ads']/nk))+'/periodo',c:'#FF6B35'},
    {l:'Meta Ads',v:fe(tot['Meta Ads']),s:tadv>0?((tot['Meta Ads']/tadv)*100).toFixed(1)+'% del budget adv':'0% del budget adv',c:'#1877F2'},
    {l:'Gestione',v:fe(tot['Gestione']),s:data.filter(t=>t.category==='Gestione').length+' tx',c:'#8B5CF6'},
    {l:'Acquisti Mat.',v:fe(tot['Acquisti Materiali']),s:data.filter(t=>t.category==='Acquisti Materiali').length+' tx',c:'#F59E0B'},
    {l:'Travel',v:fe(tot['Travel']),s:data.filter(t=>t.category==='Travel').length+' tx',c:'#06B6D4'},
  ].map(k=>`<div class="kpi" style="border-top-color:${k.c}"><div class="lbl">${k.l}</div><div class="val" style="color:${k.c}">${k.v}</div><div class="sub">${k.s}</div></div>`).join('');

  // FUNNEL KPI (solo per periodi 2026 che hanno dati lead/iscritti)
  (function(){
    const _sy=yf.value;
    const _sm=document.getElementById('mf').value;
    const _sq=document.getElementById('qf').value;
    const fKeys=Object.keys(FUNNEL_DATA).filter(k=>{
      const [fy,fm]=k.split('-').map(Number);
      if(_sy!=='all'&&fy!==+_sy) return false;
      if(view==='monthly'&&_sm!=='all'&&fm!==+_sm) return false;
      if(view==='quarterly'&&_sq!=='all'&&Math.ceil(fm/3)!==+_sq) return false;
      return true;
    });
    const el=document.getElementById('kpi-funnel');
    if(!fKeys.length){el.style.display='none';return;}
    el.style.display='';
    const totLeads=fKeys.reduce((s,k)=>s+FUNNEL_DATA[k].leads,0);
    const totIscr=fKeys.reduce((s,k)=>s+FUNNEL_DATA[k].iscritti,0);
    const cpl=tadv>0&&totLeads>0?tadv/totLeads:null;
    const cac=tadv>0&&totIscr>0?tadv/totIscr:null;
    const conv=totLeads>0?(totIscr/totLeads)*100:null;
    const fE=n=>n!=null?fe(Math.round(n)):'—';
    const fP=n=>n!=null?n.toFixed(1)+'%':'—';
    const fN=n=>n!=null?n.toLocaleString('it-IT'):'—';
    el.innerHTML=[
      {l:'Nuovi Lead',v:fN(totLeads),s:'leads generati',c:'#10B981'},
      {l:'Iscritti',v:fN(totIscr),s:'nuovi studenti',c:'#059669'},
      {l:'Cost per Lead',v:fE(cpl),s:'AdSpend ÷ Lead',c:'#14B8A6'},
      {l:'CAC',v:fE(cac),s:'Costo acquisizione cliente',c:'#F97316'},
      {l:'Conversion Rate',v:fP(conv),s:'Lead → Iscritti',c:'#A78BFA'},
    ].map(k=>`<div class="kpi" style="border-top-color:${k.c}"><div class="lbl">${k.l}</div><div class="val" style="color:${k.c}">${k.v}</div><div class="sub">${k.s}</div></div>`).join('');
  })();

  // BAR CHART title
  let barTitle='Spese ';
  if(isCatMode) barTitle+='per categoria — '+getPeriodLabel();
  else if(view==='monthly') barTitle+='mensili';
  else if(view==='quarterly' && sq!=='all') barTitle+='mensili — '+getPeriodLabel();
  else if(view==='quarterly') barTitle+='trimestrali';
  else barTitle+='annuali';
  document.getElementById('bt').textContent=barTitle;

  if(bC)bC.destroy();
  if(isCatMode){
    // Single month: one bar per category (not stacked)
    bC=new Chart(document.getElementById('barC'),{
      type:'bar',
      data:{
        labels:keys.map(kl),
        datasets:[{
          label:'Importo',
          data:keys.map(k=>Math.round((map[k][k]||0))), // k is category name
          backgroundColor:keys.map(k=>CB[k]||CB['Varie']),
          borderColor:keys.map(k=>C[k]||C['Varie']),
          borderWidth:1,borderRadius:5,
        }]
      },
      options:{responsive:true,maintainAspectRatio:false,animation:{duration:200},
        plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>` ${fe(ctx.raw)}`}}},
        scales:{
          x:{grid:{color:'rgba(255,255,255,.03)'},ticks:{font:{size:11}}},
          y:{grid:{color:'rgba(255,255,255,.03)'},ticks:{font:{size:10},callback:v=>fe(v)}}
        }
      }
    });
  } else {
    // Timeline: stacked bars
    bC=new Chart(document.getElementById('barC'),{
      type:'bar',
      data:{labels:keys.map(kl),datasets:CATS.map(c=>({
        label:c,data:keys.map(k=>Math.round(map[k][c]||0)),
        backgroundColor:CB[c],borderColor:C[c],borderWidth:1,borderRadius:3
      }))},
      options:{responsive:true,maintainAspectRatio:false,animation:{duration:200},
        plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>` ${ctx.dataset.label}: ${fe(ctx.raw)}`}}},
        scales:{
          x:{stacked:true,grid:{color:'rgba(255,255,255,.03)'},ticks:{font:{size:10},maxRotation:40}},
          y:{stacked:true,grid:{color:'rgba(255,255,255,.03)'},ticks:{font:{size:10},callback:v=>fe(v)}}
        }
      }
    });
  }

  // PIE
  const pt=CATS.map(c=>Math.round(tot[c]));
  if(pC)pC.destroy();
  pC=new Chart(document.getElementById('pieC'),{
    type:'doughnut',
    data:{labels:CATS,datasets:[{data:pt,backgroundColor:CATS.map(c=>CB[c]),borderColor:CATS.map(c=>C[c]),borderWidth:2,hoverOffset:6}]},
    options:{responsive:true,maintainAspectRatio:false,animation:{duration:200},cutout:'62%',
      plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>` ${ctx.label}: ${fe(ctx.raw)}`}}}}
  });
  document.getElementById('leg').innerHTML=CATS.map((c,i)=>`
    <div class="leg-item"><div class="leg-dot" style="background:${C[c]}"></div>
    <span>${c}: <strong>${totA>0?((pt[i]/totA)*100).toFixed(1):0}% · ${fe(pt[i])}</strong></span></div>`).join('');

  // LINE — sempre storico completo
  const amk=[...new Set(RAW.map(t=>t.year+'-'+String(t.month).padStart(2,'0')))].sort();
  const lg=[],lm=[];
  amk.forEach(k=>{
    const[yr,mo]=[parseInt(k.split('-')[0]),parseInt(k.split('-')[1])];
    lg.push(Math.round(RAW.filter(t=>t.year===yr&&t.month===mo&&t.category==='Google Ads').reduce((s,t)=>s+t.amount,0)));
    lm.push(Math.round(RAW.filter(t=>t.year===yr&&t.month===mo&&t.category==='Meta Ads').reduce((s,t)=>s+t.amount,0)));
  });
  if(lC)lC.destroy();
  // Highlight selected period on line chart
  const sy=yf.value; const sm2=document.getElementById('mf').value; const sq2=document.getElementById('qf').value;
  const ptBg=amk.map(k=>{
    const[yr,mo]=[parseInt(k.split('-')[0]),parseInt(k.split('-')[1])];
    if(sy==='all') return 'rgba(255,107,53,.7)';
    if(String(yr)!==sy) return 'rgba(255,107,53,.15)';
    if(view==='monthly'&&sm2!=='all'&&mo!==+sm2) return 'rgba(255,107,53,.15)';
    if(view==='quarterly'&&sq2!=='all'&&Math.ceil(mo/3)!==+sq2) return 'rgba(255,107,53,.15)';
    return '#FF6B35';
  });
  lC=new Chart(document.getElementById('lineC'),{
    type:'line',
    data:{
      labels:amk.map(k=>{const[y,m]=k.split('-');return MN[+m-1]+' '+y.slice(2);}),
      datasets:[
        {label:'Google Ads',data:lg,borderColor:'#FF6B35',backgroundColor:'rgba(255,107,53,.06)',tension:.35,fill:true,pointRadius:2,pointHoverRadius:5,pointBackgroundColor:ptBg},
        {label:'Meta Ads',data:lm,borderColor:'#1877F2',backgroundColor:'rgba(24,119,242,.06)',tension:.35,fill:true,pointRadius:2,pointHoverRadius:5}
      ]
    },
    options:{responsive:true,maintainAspectRatio:false,animation:{duration:200},
      plugins:{legend:{labels:{font:{size:10},boxWidth:10}},tooltip:{callbacks:{label:ctx=>` ${ctx.dataset.label}: ${fe(ctx.raw)}`}}},
      scales:{
        x:{grid:{color:'rgba(255,255,255,.03)'},ticks:{font:{size:9},maxRotation:45}},
        y:{grid:{color:'rgba(255,255,255,.03)'},ticks:{font:{size:10},callback:v=>'€'+(v/1000).toFixed(0)+'k'}}
      }
    }
  });

  rt();
}

function rt(){
  const s=document.getElementById('srch').value.toLowerCase();
  const cf=document.getElementById('cf').value;
  const data=filt().filter(t=>{
    if(cf!=='all'&&t.category!==cf)return false;
    if(!s)return true;
    return t.desc.toLowerCase().includes(s)||t.category.toLowerCase().includes(s)||t.date.includes(s);
  });
  const sorted=[...data].sort((a,b)=>b.date.localeCompare(a.date));
  const MAX=400;
  document.getElementById('tb').innerHTML=sorted.slice(0,MAX).map(t=>`
    <tr>
      <td>${fd(t.date)}</td>
      <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${t.desc}">${t.desc}</td>
      <td><span class="pill" style="background:${CP[t.category]};color:${C[t.category]};">${t.category}</span></td>
      <td><span class="${t.source==='AmEx'?'sx':'si'}">${t.source}</span></td>
      <td class="amt">${fed(t.amount)}</td>
    </tr>`).join('')+(sorted.length>MAX?`<tr><td colspan="5" style="text-align:center;color:var(--mu);padding:8px;font-size:11px;">+${sorted.length-MAX} movimenti — filtra per vedere altri</td></tr>`:'');
}

document.getElementById('yf').addEventListener('change',onYearChange);
updateSelectors();
render();
</script>
</body>
</html>
